version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  # Also bump transitive gems (rack, nokogiri, ...); advisories there fail the audit.
  allow:
  - dependency-type: all
  open-pull-requests-limit: 10
  groups:
    indirect-dependencies:
      dependency-type: production
      update-types: [minor, patch]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
